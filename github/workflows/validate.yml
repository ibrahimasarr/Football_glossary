name: Validation du Lexique Pulaar

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  run-validation:
    runs-on: ubuntu-latest

    steps:
      # 1. Récupérer le code du dépôt GitHub
      - name: Checkout repository code
        uses: actions/checkout@v4

      # 2. Installer l'environnement Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. Installer la bibliothèque polib nécessaire au script
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install polib

      # 4. Exécuter le script de validation
      - name: Run validation script
        run: |
          python valider_lexique.py "locales/ff/football_glossary.po
